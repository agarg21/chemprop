# fork-only measurement harness: ci.yml `test` job, dispatch only
name: measure-ci

on:
  workflow_dispatch:

env:
  USE_LIBUV: 0

jobs:
  test:
    name: Execute Tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # run with a login shell (so that the conda environment is activated)
        # and echo the commands we run as we do them (for debugging purposes)
        shell: bash -el {0}
    strategy:
      # if one platform/python version fails, continue testing the others
      fail-fast: false
      matrix:
        # test on all platforms with both supported versions of Python
        os: [ubuntu-latest, macos-15-intel, windows-2022]
        python-version: [3.11, 3.12, 3.13]
        exclude:
          - python-version: 3.13
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      # use a version of the conda virtual environment manager to set up an
      # isolated environment with the Python version we want
      - uses: conda-incubator/setup-miniconda@v4
        if: matrix.os != 'windows-2022'
        with:
          python-version: ${{ matrix.python-version }}
          auto-update-conda: true
          show-channel-urls: true
          conda-remove-defaults: "true"
          environment-file: environment.yml
          activate-environment: chemprop
      # use pip for windows instead, since conda doesn't work well with DLLs
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-2022'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Compatible Torch Version
        if: matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          pip install 'torch==2.7.0'
      - name: Install dependencies (conda)
        if: matrix.os != 'windows-2022'
        shell: bash -l {0}
        run: |
          # conda (environment.yml) already provides cuik_molmaker + rdkit and all
          # runtime deps; install chemprop with --no-deps so pip does NOT pull
          # cuik_molmaker_pin and force-upgrade rdkit (which causes an ABI/segfault).
          python -m pip install --no-deps -e .
          python -m pip install "ray[tune]" hyperopt optuna "setuptools<82" pytest pytest-cov nbmake ipykernel
      - name: Install dependencies (pip)
        if: matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          python -m pip install nbmake
          python -m pip install -e ".[dev,docs,test,hpopt]"
      - name: Test with pytest
        shell: bash -l {0}
        run: |
          pytest -v tests
      - name: Test notebooks
        if: ${{ !(matrix.os == 'macos-15-intel' && matrix.python-version == '3.12') }}
        shell: bash -l {0}
        run: |
          python -m pip install matplotlib
          pytest --no-cov -v --nbmake $(find examples -name '*.ipynb' ! -name 'use_featurizer_with_other_libraries.ipynb' ! -name 'shapley_value_with_customized_featurizers.ipynb')
          pytest --no-cov -v --nbmake $(find docs/source/tutorial/python -name "*.ipynb")
